name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Ubuntu ${{ matrix.ubuntu }})
    runs-on: ubuntu-${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04"]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi python3-gi-cairo \
            gir1.2-gtk-3.0 pyflakes3
      - name: Lint
        run: python3 -m pyflakes kerio_vpn bin/kerio-vpn libexec/* tests tools
      - name: Unit tests
        run: make test

  package:
    name: Build .deb
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-gtk-3.0
      - name: Build package
        run: make deb
      - uses: actions/upload-artifact@v4
        with:
          name: kerio-vpn-deb
          path: dist/*.deb

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: kerio-vpn-deb
          path: dist
      - name: Stable download name and checksums
        run: |
          cd dist
          cp kerio-vpn_*_all.deb kerio-vpn_latest_all.deb
          sha256sum *.deb > SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on && /^\[[0-9.]+\]:/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'NOTES'

          ### Install

          ```sh
          wget -O /tmp/kerio-vpn.deb https://github.com/${{ github.repository }}/releases/latest/download/kerio-vpn_latest_all.deb
          sudo apt install /tmp/kerio-vpn.deb
          ```

          Requires a Debian-based distribution (Ubuntu, Debian, Linux Mint …) on amd64.
          Kerio VPN installs the official Kerio Control VPN Client on first start if it is missing.
          NOTES
          sed -i 's/^          //' notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: Kerio VPN ${{ github.ref_name }}
          body_path: notes.md
          files: |
            dist/*.deb
            dist/SHA256SUMS
