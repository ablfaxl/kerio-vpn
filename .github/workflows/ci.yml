name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Ubuntu ${{ matrix.ubuntu }})
    runs-on: ubuntu-${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04"]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi python3-gi-cairo \
            gir1.2-gtk-3.0 pyflakes3
      - name: Lint
        run: python3 -m pyflakes kerio_vpn bin/kerio-vpn libexec/* tests tools
      - name: Unit tests
        run: make test

  package:
    name: Build .deb
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-gtk-3.0
      - name: Build .deb
        run: make deb
      - name: Build AppImage
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          curl -fsSL -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          printf '#!/bin/sh\nexec "%s/appimagetool.AppImage" --appimage-extract-and-run "$@"\n' "$PWD" > appimagetool
          chmod +x appimagetool
          APPIMAGETOOL="$PWD/appimagetool" packaging/build-appimage.sh
      - uses: actions/upload-artifact@v7
        with:
          name: kerio-vpn-deb
          path: |
            dist/*.deb
            dist/*.AppImage

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kerio-vpn-deb
          path: dist
      - name: Stable download name and checksums
        run: |
          cd dist
          cp kerio-vpn_*_all.deb kerio-vpn_latest_all.deb
          cp kerio-vpn-*-x86_64.AppImage kerio-vpn-latest-x86_64.AppImage
          sha256sum *.deb *.AppImage > SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on && /^\[[0-9.]+\]:/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'NOTES'

          ### Install

          ```sh
          wget -O /tmp/kerio-vpn.deb https://github.com/${{ github.repository }}/releases/latest/download/kerio-vpn_latest_all.deb
          sudo apt install /tmp/kerio-vpn.deb
          ```

          An AppImage is attached as well (it uses the system's python3 and GTK 3; privileged
          actions always ask for the administrator password, so the .deb is recommended).

          Requires a Debian-based distribution (Ubuntu, Debian, Linux Mint …) on amd64.
          Kerio VPN installs the official Kerio Control VPN Client on first start if it is missing.
          NOTES
          sed -i 's/^          //' notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: Kerio VPN ${{ github.ref_name }}
          body_path: notes.md
          files: |
            dist/*.deb
            dist/*.AppImage
            dist/SHA256SUMS
